<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0f14">
<title>Sem conexão | MotoTrip</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         background: radial-gradient(circle at 30% 20%, #2a0a10, #0d0f14 55%, #08090c); color: #f1f3f6;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 28px; letter-spacing: .02em; text-transform: uppercase; margin: 20px 0 8px; }
  p { color: #aeb4c2; max-width: 320px; margin: 0 auto 24px; line-height: 1.5; }
  button { background: #d90f25; color: #fff; border: 0; border-radius: 6px; padding: 12px 22px; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <img src="/icon.svg" alt="MotoTrip">
    <h1>Sem conexão</h1>
    <p>Parece que você está sem internet. As páginas que você já visitou continuam disponíveis; tente de novo quando a conexão voltar.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
