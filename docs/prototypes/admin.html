<title>MotoTrip Admin Protótipos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Three admin/curator directions for MotoTrip. Dark-first, racing red on steel (same tokens as submit-route prototype). */
:root{
  --bg:#0d0f14; --surface:#151922; --surface-2:#1d222d; --surface-3:#242a37; --line:#2b313f; --line-soft:#222834;
  --fg:#f6f7f9; --fg-2:#d5d9e2; --muted:#8592aa;
  --brand:#f5293d; --brand-strong:#d90f25; --brand-soft:rgba(245,41,61,.14); --brand-text:#ff99a3;
  --ok:#34d399; --ok-soft:rgba(52,211,153,.13); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.13);
  --bad:#f87171; --bad-soft:rgba(248,113,113,.13); --info:#7dd3fc; --info-soft:rgba(125,211,252,.12);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --grid:#232a37; --map-bg:#11141b; --contour:#1f2531;
  --shadow:0 30px 60px -30px rgba(0,0,0,.8);
  --display:"Barlow Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eceef2; --surface-3:#e2e5eb; --line:#d5d9e2; --line-soft:#e4e7ed;
  --fg:#0f1218; --fg-2:#2b313f; --muted:#515d77;
  --brand:#d90f25; --brand-strong:#b50a1e; --brand-soft:rgba(217,15,37,.09); --brand-text:#b50a1e;
  --ok:#047857; --ok-soft:rgba(5,150,105,.1); --warn:#b45309; --warn-soft:rgba(217,119,6,.12);
  --bad:#b91c1c; --bad-soft:rgba(220,38,38,.09); --info:#0369a1; --info-soft:rgba(3,105,161,.09);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --grid:#e4e7ed; --map-bg:#eef0f4; --contour:#dde1e8;
  --shadow:0 24px 50px -28px rgba(15,18,24,.35); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eceef2; --surface-3:#e2e5eb; --line:#d5d9e2; --line-soft:#e4e7ed;
  --fg:#0f1218; --fg-2:#2b313f; --muted:#515d77;
  --brand:#d90f25; --brand-strong:#b50a1e; --brand-soft:rgba(217,15,37,.09); --brand-text:#b50a1e;
  --ok:#047857; --ok-soft:rgba(5,150,105,.1); --warn:#b45309; --warn-soft:rgba(217,119,6,.12);
  --bad:#b91c1c; --bad-soft:rgba(220,38,38,.09); --info:#0369a1; --info-soft:rgba(3,105,161,.09);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --grid:#e4e7ed; --map-bg:#eef0f4; --contour:#dde1e8;
  --shadow:0 24px 50px -28px rgba(15,18,24,.35); color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;margin:0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));overflow-x:hidden}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
.display{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.95;letter-spacing:.005em}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--brand-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- page header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.top h1{font-size:clamp(2rem,4.4vw,3.2rem)}
.top h1 span{color:var(--brand)}
.top p{margin-top:6px;color:var(--muted);max-width:70ch}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center;min-width:0}
.tab b{font-family:var(--display);font-size:22px;line-height:1;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.tab span{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);min-width:0}
.tab span strong{color:var(--fg);font-size:14px}
.tab[aria-selected="true"]{border-color:var(--brand)}
.tab[aria-selected="true"] b{background:var(--brand);color:#fff}
@media (max-width:760px){.tabs{grid-template-columns:1fr}}

.screen{background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);min-height:760px;position:relative}

/* ---------- shared atoms ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-strong)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.icon{padding:6px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn.ok{color:var(--ok)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input,.select,textarea.input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13.5px;min-width:0}
.input:focus,.select:focus,textarea.input:focus{outline:none;border-color:var(--brand)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--fg-2)}
label.f small{font-weight:500;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill svg.i{width:12px;height:12px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.pill.brand{background:var(--brand-soft);color:var(--brand-text)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75}
.chip.chip-attn{border-color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:14px;font-weight:700}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.lang{display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:1px 5px;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.stars{display:inline-flex;gap:1px;color:var(--warn);font-size:12px;letter-spacing:-1px}
.stars .off{color:var(--line)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.t tr.row{cursor:pointer}
table.t tr.row:hover td{background:var(--surface-2)}
table.t tr.sel td{background:var(--brand-soft)}
.cell-title{display:flex;align-items:center;gap:10px;min-width:220px}
.cell-title b{font-weight:600;display:block}
.cell-title small{color:var(--muted);font-size:12px}
.thumb{width:52px;height:36px;border-radius:7px;overflow:hidden;flex:none;background:var(--map-bg);border:1px solid var(--line)}
.thumb svg{width:100%;height:100%;display:block}
.toggle{border:0;background:transparent;cursor:pointer;padding:4px;border-radius:6px;color:var(--muted);display:inline-grid;place-items:center}
.toggle:hover{background:var(--surface-3)}
.toggle.on{color:var(--warn)}
.toggle.on.eye{color:var(--ok)}
.toggle.on svg.i{fill:currentColor}
.toggle.eye.on svg.i{fill:none}
.menu{position:relative;display:inline-block}
.menu>summary{list-style:none;cursor:pointer}
.menu>summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;min-width:210px;box-shadow:var(--shadow)}
.menu .pop button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:7px 9px;border-radius:7px;font-size:13px;cursor:pointer;text-align:left;color:var(--fg)}
.menu .pop button:hover{background:var(--surface-2)}
.menu .pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .pop .danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:200;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:9px 12px;border-radius:10px;background:var(--info-soft);color:var(--fg-2)}
.note svg{color:var(--info);margin-top:2px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,6,9,.6);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(480px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.modal h3{font-size:17px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);z-index:20;white-space:nowrap;opacity:0;transition:opacity .1s}
.tip b{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:6px;color:var(--fg)}
.tip .sw{width:8px;height:8px;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--fg-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.statusbar{display:flex;gap:2px;height:14px;border-radius:5px;overflow:hidden}
.statusbar div{height:100%}
.hbar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:12.5px;padding:3px 0}
.hbar .track{height:10px;background:transparent;position:relative}
.hbar .fill{height:100%;border-radius:0 4px 4px 0;background:var(--brand)}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-2)}
.hbar:hover .fill{filter:brightness(1.15)}

/* editor: markdown preview / blocks (shared) */
.prose{font-size:15.5px;line-height:1.7;color:var(--fg-2)}
.prose h2{font-family:var(--display);text-transform:uppercase;font-size:26px;color:var(--fg);margin:26px 0 8px;line-height:1.05}
.prose h3{font-size:17px;color:var(--fg);margin:20px 0 6px}
.prose p{margin:0 0 12px}
.prose blockquote{border-left:3px solid var(--brand);margin:12px 0;padding:2px 14px;color:var(--fg)}
.prose figure{margin:18px 0}
.prose figure img,.prose figure .ph{width:100%;border-radius:12px;display:block;aspect-ratio:16/9;object-fit:cover}
.prose figure.wide{margin-left:-40px;margin-right:-40px}
.prose figure.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prose figure.gallery figcaption{grid-column:1/-1}
.prose figcaption{font-size:12.5px;color:var(--muted);margin-top:6px;text-align:center}
.prose .tipbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 14px;margin:14px 0;color:var(--fg)}
.prose .tipbox::before{content:"Dica";display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--warn);margin-bottom:2px}
.routecard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px;margin:14px 0}
.routecard .thumb{width:84px;height:58px}
.routecard b{display:block;color:var(--fg);font-size:14px}
.routecard small{color:var(--muted);font-size:12px}
.serp{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:Arial,sans-serif}
.serp .u{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.serp .u i{width:18px;height:18px;border-radius:50%;background:var(--brand);display:inline-block}
.serp .tt{color:#8ab4f8;font-size:18px;line-height:1.3;margin:4px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:root[data-theme="light"] .serp .tt{color:#1a0dab}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .serp .tt{color:#1a0dab}}
.serp .dd{font-size:13px;color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.counter{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.counter.ok{color:var(--ok)} .counter.warn{color:var(--warn)} .counter.bad{color:var(--bad)}
.meter{height:4px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:4px}
.meter div{height:100%;border-radius:3px}
.kw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px}
.kw span{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 8px;font-size:12.5px}
.kw span button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 3px;font-size:14px;line-height:1}
.kw input{border:0;background:transparent;flex:1;min-width:110px;padding:3px;font-size:13px}
.kw input:focus{outline:none}
.checks{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.checks div{display:flex;gap:8px;align-items:flex-start}
.checks svg.i{width:14px;height:14px;margin-top:2px}
.checks .y{color:var(--ok)} .checks .n{color:var(--warn)}
.ring{--p:70;--c:var(--ok);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-3) 0);flex:none}
.ring b{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.ring.sm{width:30px;height:30px}.ring.sm b{width:23px;height:23px;font-size:10.5px}
.drop-hint{position:absolute;inset:0;border:2px dashed var(--brand);border-radius:10px;background:var(--brand-soft);display:none;place-items:center;font-weight:700;color:var(--brand-text);pointer-events:none;z-index:5}
.dragging .drop-hint{display:grid}

/* ====================== A — Cockpit ====================== */
.A{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:760px}
.A-side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:8px;padding:4px 8px 16px}
.logo b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em}
.logo b span{color:var(--brand)}
.logo small{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.A-nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--muted);font-weight:600;cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.A-nav:hover{background:var(--surface-2);color:var(--fg)}
.A-nav[aria-current="page"]{background:var(--brand-soft);color:var(--fg)}
.A-nav[aria-current="page"] svg{color:var(--brand)}
.A-nav .badge{margin-left:auto;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px}
.A-group{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:14px 10px 4px}
.A-me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px}
.A-me small{display:block;color:var(--muted);font-size:11.5px}
.A-main{display:flex;flex-direction:column;min-width:0}
.A-top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.A-top .crumb{font-weight:700;font-size:15px}
.A-top .crumb span{color:var(--muted);font-weight:500}
.A-top .search{margin-left:auto;position:relative;width:min(280px,100%)}
.A-top .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.A-top .search .input{padding-left:32px}
.A-body{padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.A-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.A-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.A-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.spark{height:34px;margin-top:6px}
.queue-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft)}
.queue-row:first-child{border-top:0}
.queue-row .meta{flex:1;min-width:0}
.queue-row .meta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-row .meta small{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .sp{flex:1}
.bulk{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--brand-soft);border:1px solid var(--brand);border-radius:10px;flex-wrap:wrap;font-weight:600;font-size:13px}
.A-tablecard{padding:0;overflow:hidden}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .db{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.mapbig{height:170px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--map-bg)}
.mapbig svg{width:100%;height:100%;display:block}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.facts b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.facts small{color:var(--muted);font-size:11px}
.score-row{display:grid;grid-template-columns:120px 1fr 30px;gap:10px;align-items:center;font-size:12.5px}
.score-row input{width:100%;accent-color:var(--brand)}
/* A editor */
.A-ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.A-ed .langs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.A-ed .langs button{border:0;background:transparent;padding:8px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.A-ed .langs button[aria-selected="true"]{border-color:var(--brand);color:var(--fg)}
.A-ed .langs button .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.A-ed .langs button .dot.miss{background:var(--warn)}
.mdbar{display:flex;gap:2px;flex-wrap:wrap;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--surface)}
.mdbar .sep{width:1px;background:var(--line);margin:4px 4px}
.mdbar .btn.icon{color:var(--fg-2)}
.mdwrap{position:relative}
.mdwrap textarea{width:100%;min-height:440px;resize:vertical;border-radius:0 0 10px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.65;padding:14px}
.splitview{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.splitview.write{grid-template-columns:1fr}.splitview.write .pv{display:none}
.splitview.preview{grid-template-columns:1fr}.splitview.preview .ed{display:none}
.pv{border:1px solid var(--line);border-radius:10px;padding:18px 22px;background:var(--surface);max-height:532px;overflow:auto}
.pv .prose figure.wide{margin-left:-22px;margin-right:-22px}
.aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.aside .tabsx{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px;border:1px solid var(--line)}
.aside .tabsx button{border:0;background:transparent;padding:7px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center}
.aside .tabsx button[aria-selected="true"]{background:var(--surface);color:var(--fg)}
.imgpop{position:absolute;z-index:30;top:46px;right:6px;width:min(320px,calc(100% - 12px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.upl{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:6px}
.upl:hover{border-color:var(--brand);color:var(--fg)}
.upl img{max-width:100%;border-radius:8px;max-height:120px}
@media (max-width:1100px){
  .A-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .A-grid,.A-grid3{grid-template-columns:minmax(0,1fr)}
  .A-ed{grid-template-columns:minmax(0,1fr)} .aside{position:static}
  .splitview{grid-template-columns:1fr}
}
@media (max-width:820px){
  .A{grid-template-columns:minmax(0,1fr)}
  .A-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:2px}
  .A-side .logo,.A-group,.A-me{display:none}
  .A-nav{width:auto;white-space:nowrap}
  .A-body{padding:14px}
}

/* ====================== B — Fila / Command ====================== */
.B{display:flex;flex-direction:column;min-height:760px}
.B-top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.B-nav{display:flex;gap:2px;flex-wrap:wrap}
.B-nav button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;gap:7px;align-items:center}
.B-nav button:hover{color:var(--fg)}
.B-nav button[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.B-nav .badge{background:var(--brand);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 6px}
.cmdk{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 10px;color:var(--muted);cursor:pointer;min-width:220px;font-size:13px}
.cmdk kbd{margin-left:auto;font-family:var(--body);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface)}
.B-body{padding:22px;display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%;margin:0 auto;min-width:0}
.B-hello h2{font-family:var(--display);font-size:38px;text-transform:uppercase;font-weight:800;line-height:1}
.B-attn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.attn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.attn:hover{border-color:var(--brand);transform:translateY(-1px)}
.attn .n{font-family:var(--display);font-size:40px;font-weight:800;line-height:.9}
.attn .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.attn .go{margin-top:auto;font-size:12.5px;font-weight:700;color:var(--brand-text);display:flex;gap:4px;align-items:center}
.B-multi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.B-multi .card .v{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.B-two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.over{border-color:var(--brand);background:var(--brand-soft)}
.col .ch{display:flex;align-items:center;gap:8px;padding:4px 4px 6px;font-weight:700}
.col .ch .n{color:var(--muted);font-weight:600}
.kcard{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:grab;text-align:left;width:100%;padding:0}
.kcard:hover{border-color:var(--muted)}
.kcard.active{border-color:var(--brand)}
.kcard .km{height:74px;background:var(--map-bg)}
.kcard .km svg{width:100%;height:100%;display:block}
.kcard .kb{padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.kcard .kb b{font-size:13px}
.kcard .kb .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.B-split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
.B-split.users{grid-template-columns:340px minmax(0,1fr)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:12px}
.sheet .sb{padding:16px;display:flex;flex-direction:column;gap:12px}
.ulist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ulist .uh{padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.urow{display:flex;gap:10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line-soft);background:transparent;width:100%;text-align:left;cursor:pointer}
.urow:hover{background:var(--surface-2)}
.urow[aria-selected="true"]{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
.urow .m{flex:1;min-width:0}
.urow .m b{display:block;font-size:13px}
.urow .m small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-hd{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.profile-hd .avatar{width:56px;height:56px;font-size:18px}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.timeline div{position:relative;padding:0 0 14px 16px;font-size:13px}
.timeline div::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.timeline div.bad::before{border-color:var(--bad)} .timeline div.ok::before{border-color:var(--ok)}
.timeline small{display:block;color:var(--muted);font-size:11.5px}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;flex-wrap:wrap}
.prow:hover{border-color:var(--muted)}
.prow .m{flex:1;min-width:200px}
.prow .m b{display:block}
.prow .m small{color:var(--muted);font-size:12px}
/* B block editor */
.B-ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.blocks{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 40px 40px;min-width:0}
.blocks .ttl{font-family:var(--display);font-size:40px;font-weight:800;text-transform:uppercase;line-height:1;color:var(--fg);outline:none;margin-bottom:8px}
.blocks .dsc{font-size:16px;color:var(--muted);outline:none;margin-bottom:18px}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.6}
.blk{position:relative;border-radius:8px;margin:0 -10px;padding:0 10px}
.blk:hover{background:color-mix(in oklab,var(--surface-2) 50%,transparent)}
.blk .hdl{position:absolute;left:-30px;top:4px;display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .12s}
.blk:hover .hdl,.blk:focus-within .hdl{opacity:1}
.blk .hdl button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px;border-radius:5px;display:grid;place-items:center}
.blk .hdl button:hover{background:var(--surface-3);color:var(--fg)}
.blk [contenteditable]{outline:none}
.slash{position:absolute;z-index:30;left:10px;top:calc(100% + 2px);width:270px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;max-height:320px;overflow:auto}
.slash .lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px 4px}
.slash button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:7px 8px;border-radius:8px;cursor:pointer;text-align:left;color:var(--fg)}
.slash button:hover,.slash button.hl{background:var(--surface-2)}
.slash button .ico{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface-2);flex:none}
.slash button small{display:block;color:var(--muted);font-size:11.5px}
.imgblk{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2);margin:14px 0;display:flex;flex-direction:column;gap:8px}
.imgblk .ph,.imgblk img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;display:block}
.imgblk .gal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.imgblk .gal .ph,.imgblk .gal img{aspect-ratio:4/3}
.imgblk .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.imgblk .bar .input{flex:1;min-width:140px;padding:6px 8px;font-size:12.5px;background:var(--surface)}
.imgblk .warnalt{font-size:11.5px;color:var(--warn);display:flex;gap:5px;align-items:center}
.imgblk.wide{margin-left:-30px;margin-right:-30px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.acc>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:700}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .chev{margin-left:auto;transition:transform .15s;color:var(--muted)}
.acc[open]>summary .chev{transform:rotate(180deg)}
.acc .ab{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.palette{position:fixed;inset:0;background:rgba(5,6,9,.55);z-index:120;display:flex;justify-content:center;padding:12vh 16px 16px}
.palette .box{width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;align-self:flex-start}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 16px;font-size:15px}
.palette input:focus{outline:none}
.palette .res{max-height:50vh;overflow:auto;padding:6px}
.palette .res button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--fg)}
.palette .res button:hover,.palette .res button.hl{background:var(--surface-2)}
.palette .res small{margin-left:auto;color:var(--muted);font-size:11.5px}
@media (max-width:1100px){
  .B-attn,.B-multi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .B-two,.B-split,.B-split.users,.B-ed{grid-template-columns:minmax(0,1fr)}
  .sheet{position:static}
}
@media (max-width:760px){
  .kanban{grid-template-columns:minmax(0,1fr)}
  .B-body{padding:14px}
  .blocks{padding:20px 18px 28px}
  .blk .hdl{position:static;flex-direction:row;opacity:1;margin-bottom:2px}
  .cmdk{min-width:0;flex:1}
  .imgblk.wide{margin-left:0;margin-right:0}
}

/* ====================== C — Editorial ====================== */
.C{display:grid;grid-template-columns:72px minmax(0,1fr);min-height:760px}
.C-rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0}
.C-rail .mk{font-family:var(--display);font-weight:800;font-size:22px;color:#fff;background:var(--brand);width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px}
.C-rail button{width:48px;height:48px;border-radius:12px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;font-weight:700;position:relative}
.C-rail button svg.i{width:19px;height:19px}
.C-rail button:hover{background:var(--surface-2);color:var(--fg)}
.C-rail button[aria-current="page"]{background:var(--fg);color:var(--bg)}
.C-rail button .dot{position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
.C-main{min-width:0;display:flex;flex-direction:column}
.C-head{padding:26px 28px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.C-head h2{font-family:var(--display);font-size:clamp(34px,5vw,54px);font-weight:800;text-transform:uppercase;line-height:.92}
.C-head h2 span{color:var(--brand)}
.C-body{padding:18px 28px 32px;display:flex;flex-direction:column;gap:16px;min-width:0}
.C-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.C-big{background:linear-gradient(140deg,var(--brand-strong),#5d0712 80%);color:#fff;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;min-height:250px}
:root[data-theme="light"] .C-big{background:linear-gradient(140deg,#d90f25,#7a0a17 85%)}
.C-big .v{font-family:var(--display);font-size:clamp(70px,9vw,120px);font-weight:800;line-height:.82}
.C-big .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;opacity:.8}
.C-big .row{display:flex;gap:22px;flex-wrap:wrap;margin-top:auto}
.C-big .row div b{display:block;font-family:var(--display);font-size:28px;line-height:1}
.C-big .row div small{opacity:.8;font-size:12px}
.C-big svg.bg{position:absolute;right:-20px;bottom:-30px;width:60%;opacity:.25}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tile{border-radius:10px;padding:10px;min-height:66px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);cursor:default}
.tile b{font-family:var(--display);font-size:24px;line-height:1}
.tile small{font-size:11.5px;font-weight:600}
.C-three{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat div{aspect-ratio:1;border-radius:3px;min-width:0}
.lead{display:flex;flex-direction:column}
.lead .lr{display:grid;grid-template-columns:26px 64px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.lead .lr:first-child{border-top:0}
.lead .lr .rk{font-family:var(--display);font-size:22px;color:var(--muted);font-weight:800}
.lead .lr .thumb{width:64px;height:42px}
.lead .lr b{display:block;font-size:13px}
.lead .lr small{color:var(--muted);font-size:11.5px}
.C-filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.gcard .gm{height:150px;background:var(--map-bg);position:relative}
.gcard .gm>svg{width:100%;height:100%;display:block}
.gcard .gm .pill{position:absolute;left:10px;top:10px;backdrop-filter:blur(6px)}
.gcard .gm .feat{position:absolute;right:10px;top:10px}
.gcard .gb{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.gcard .gb b{font-size:15px}
.gcard .gb .row{display:flex;gap:10px;color:var(--muted);font-size:12px;flex-wrap:wrap;align-items:center}
.gcard .ga{display:flex;gap:4px;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.gcard .ga .btn{flex:1;justify-content:center}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.person .ph{display:flex;gap:12px;align-items:center}
.person .ph .avatar{width:46px;height:46px;font-size:15px}
.person .ph b{display:block}
.person .ph small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.person .st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.person .st div{background:var(--surface-2);border-radius:9px;padding:6px}
.person .st b{display:block;font-family:var(--display);font-size:20px;line-height:1}
.person .st small{font-size:10.5px;color:var(--muted)}
.person .pa{display:flex;gap:6px;align-items:center;margin-top:auto}
.mag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mag .post{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.mag .post:hover{border-color:var(--muted)}
.mag .post .cv{aspect-ratio:16/9;position:relative}
.mag .post .cv>svg{width:100%;height:100%;display:block}
.mag .post .cv .pill{position:absolute;left:10px;top:10px}
.mag .post .cv .ring{position:absolute;right:10px;top:10px}
.mag .post .pb{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.mag .post .pb b{font-size:15.5px;line-height:1.3}
.mag .post.hero{grid-column:span 2;flex-direction:row}
.mag .post.hero .cv{aspect-ratio:auto;flex:1.3;min-height:240px}
.mag .post.hero .pb{flex:1;justify-content:center;padding:22px}
.mag .post.hero .pb b{font-family:var(--display);font-size:32px;text-transform:uppercase;line-height:1}
/* C full page editor */
.C-ed{position:relative;min-height:760px;background:var(--bg)}
.C-edtop{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in oklab,var(--bg) 85%,transparent);backdrop-filter:blur(8px);z-index:10;flex-wrap:wrap}

.C-page .dsc{font-size:18px;color:var(--muted);outline:none;margin:10px 0 24px}
.gut{height:14px;position:relative;margin:0 -10px}
.gut button.plus{position:absolute;left:-26px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .12s}
.gut::after{content:"";position:absolute;left:10px;right:10px;top:50%;border-top:1px dashed transparent}
.gut:hover button.plus,.gut.open button.plus{opacity:1}
.gut:hover::after,.gut.open::after{border-color:var(--line)}
.gut .ins{position:absolute;left:6px;top:50%;transform:translateY(-50%);display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow);z-index:12;flex-wrap:wrap}

.gut .ins button:hover{background:var(--surface-2)}
.dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);z-index:15;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px)}

      bars += `<text x="${cx}" y="${H - 5}" text-anchor="middle">${l}</text><rect x="${cx - step / 2}" y="0" width="${step}" height="${H - padB}" fill="transparent" class="col-hit" data-i="${i}"/>`;
    });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}${bars}</svg>`;
    const t = tipEl(el);
    el.querySelectorAll('.col-hit').forEach(r => {
      r.addEventListener('pointerenter', () => { const i = +r.dataset.i; t.innerHTML = `<b>${labels[i]} · ${tot[i]} rotas</b>` + names.map((n, k) => ({ n, k })).reverse().map(({ n, k }) => `<div class="r"><span class="sw" style="background:${colors[k]}"></span>${n}: <strong class="num">${groups[k][i]}</strong></div>`).join(''); placeTip(el, t, padL + step * i + step / 2, y(tot[i])) });
      r.addEventListener('pointerleave', () => t.style.opacity = 0);
    });
  };
}
const catColors = () => ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];

}
function statusBar() {

/* ================================================================ shared modals */
function modal(html, onMount) {
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg); const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) close() });
  onMount?.(bg, close); bg.querySelector('input,textarea,select,button')?.focus();
}

  <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="do">Rejeitar rota</button></div>`, (bg, close) => {
    bg.querySelector('#do').onclick = () => { r.status = 'rejected'; r.published = false; close(); toast('Rota rejeitada e autor notificado'); render() };

function approveRoute(r) { r.status = 'approved'; r.published = true; toast(`“${r.title}” aprovada e publicada`); render() }

}
function moderate(u, kind) {

  const ban = kind === 'ban';
  modal(`<h3>${ban ? 'Banir' : 'Suspender'} ${esc(u.name)}</h3><p class="muted">${ban ? 'A conta perde o acesso de forma permanente até ser reativada.' : 'A conta não consegue entrar nem publicar durante o período.'}</p>
  ${ban ? '' : `<label class="f">Duração<div class="seg" id="dur"><button aria-pressed="false">1 dia</button><button aria-pressed="true">7 dias</button><button aria-pressed="false">30 dias</button><button aria-pressed="false">Personalizado</button></div></label>`}
  <label class="f">Motivo <small>Enviado ao usuário e guardado no histórico</small><textarea class="input" rows="3" placeholder="Ex.: spam repetido nos comentários"></textarea></label>
  <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px"><input type="checkbox" checked style="accent-color:var(--brand);margin-top:3px"> <span>Ocultar rotas, fotos e comentários deste usuário<br><small class="muted">Pode ser revertido depois</small></span></label>
  <div class="acts"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="do">${ban ? ic('ban') + 'Banir' : ic('pause') + 'Suspender'}</button></div>`, (bg, close) => {

    bg.querySelector('#do').onclick = () => { u.status = ban ? 'banned' : 'suspended'; u.until = ban ? null : 'termina em 7 dias'; u.hidden = true; close(); toast(ban ? 'Usuário banido' : 'Usuário suspenso'); render() };
